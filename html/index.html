<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Practice Page</title>
</head>
<body>

    <header>
        <h1>Student Information Portal</h1>
    </header>

    <main>

        <section>
            <h2>Student Records</h2>

            <table border="1">
                <caption>Student Details</caption>

                <thead>
                    <tr>
                        <th>Roll No.</th>
                        <th>Name</th>
                        <th>Branch</th>
                        <th>Semester</th>
                        <th>CGPA</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>101</td>
                        <td>Alice</td>
                        <td>CSE</td>
                        <td>3</td>
                        <td>9.1</td>
                    </tr>

                    <tr>
                        <td>102</td>
                        <td>Bob</td>
                        <td>ECE</td>
                        <td>5</td>
                        <td>8.6</td>
                    </tr>

                    <tr>
                        <td>103</td>
                        <td>Charlie</td>
                        <td>ME</td>
                        <td>7</td>
                        <td>8.2</td>
                    </tr>
                </tbody>

                <tfoot>
                    <tr>
                        <td colspan="5">End of Student Records</td>
                    </tr>
                </tfoot>

            </table>
        </section>

        <hr>

        <section>
            <h2>Registration Form</h2>

            <form>

                <fieldset>
                    <legend>Personal Information</legend>

                    <p>
                        <label for="name">Full Name:</label><br>
                        <input type="text" id="name" name="name" placeholder="Enter your name">
                    </p>

                    <p>
                        <label for="email">Email:</label><br>
                        <input type="email" id="email" name="email" placeholder="abc@example.com">
                    </p>

                    <p>
                        <label for="password">Password:</label><br>
                        <input type="password" id="password" name="password">
                    </p>

                    <p>
                        <label for="age">Age:</label><br>
                        <input type="number" id="age" name="age" min="18" max="60">
                    </p>

                    <p>
                        <label>Date of Birth:</label><br>
                        <input type="date" name="dob">
                    </p>

                    <p>
                        <label>Gender:</label><br>

                        <input type="radio" id="male" name="gender">
                        <label for="male">Male</label>

                        <input type="radio" id="female" name="gender">
                        <label for="female">Female</label>

                        <input type="radio" id="other" name="gender">
                        <label for="other">Other</label>
                    </p>

                    <p>
                        <label>Programming Languages:</label><br>

                        <input type="checkbox" id="html" name="html">
                        <label for="html">HTML</label>

                        <input type="checkbox" id="css" name="css">
                        <label for="css">CSS</label>

                        <input type="checkbox" id="js" name="js">
                        <label for="js">JavaScript</label>
                    </p>

                    <p>
                        <label for="branch">Branch:</label><br>

                        <select id="branch" name="branch">
                            <option>CSE</option>
                            <option>ECE</option>
                            <option>ME</option>
                            <option>CE</option>
                        </select>
                    </p>

                    <p>
                        <label for="message">Address:</label><br>
                        <textarea id="message" name="message" rows="4" cols="40"></textarea>
                    </p>

                    <p>
                        <label for="color">Favorite Color:</label><br>
                        <input type="color" id="color" name="color">
                    </p>

                    <p>
                        <label for="resume">Resume:</label><br>
                        <input type="file" id="resume" name="resume">
                    </p>

                    <p>
                        <input type="submit" value="Submit">
                        <input type="reset" value="Reset">
                    </p>

                </fieldset>

            </form>

        </section>

        <hr>

        <section>

            <details>
                <summary>Click to Watch a Video</summary>

                <iframe
                    width="560"
                    height="315"
                    src="https://www.youtube.com/embed/dQw4w9WgXcQ"
                    title="YouTube Video"
                    allowfullscreen>
                </iframe>

            </details>

        </section>

    </main>

</body>
</html>
